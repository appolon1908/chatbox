name: Required exact-SHA CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full repository commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

jobs:
  exact-sha:
    name: Test exact repository SHA
    runs-on: [self-hosted, Linux, X64, codestra-ci, codestra-chatbox]
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git fsck --no-progress
